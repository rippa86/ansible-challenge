---
- name: Hello World Ansible Island Challenge Treasurehunt
  gather_facts: true
  hosts: web
  tasks:

    - name: Display facts
      ansible.builtin.debug:
        var: ansible_facts

    - name: Display stats
      ansible.builtin.set_stats:
        data:
          cpu_arch: "{{ hostvars['node1']ansible_facts.machine }}"
          os_family: "{{ hostvars['node1']ansible_facts.os_family }}"